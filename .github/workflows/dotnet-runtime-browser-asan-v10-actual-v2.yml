name: dotnet-runtime-browser-asan-v10-actual-v2

on:
  pull_request:
    paths:
      - '.github/workflows/dotnet-runtime-browser-asan-v10-actual-v2.yml'
      - 'dotnet-runtime-browser-asan-v10-trigger-v2.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-mono-asan-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Reclaim disk and install prerequisites
        shell: bash
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libkrb5-dev libssl-dev zlib1g-dev libicu-dev libunwind-dev libcurl4-openssl-dev liblttng-ust-dev libnuma-dev uuid-dev

      - name: Checkout supported runtime
        uses: actions/checkout@v4
        with:
          repository: dotnet/runtime
          ref: v10.0.10
          path: runtime
          fetch-depth: 1

      - name: Build truly instrumented Browser Mono and run clean Node sample
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1:allocator_may_return_null=1
        run: |
          set +e
          OUT="$GITHUB_WORKSPACE/out/browser-asan-v10-v2"
          mkdir -p "$OUT/bundle"
          cd "$GITHUB_WORKSPACE/runtime"
          git rev-parse HEAD | tee "$OUT/runtime-commit.txt"
          git describe --tags --always | tee "$OUT/runtime-ref.txt"
          node --version | tee "$OUT/node-version.txt"

          timeout --signal=TERM --kill-after=2m 125m ./build.sh -os browser -subset mono+libs -c Debug 2>&1 | tee "$OUT/baseline-build.log"
          BASE_RC=${PIPESTATUS[0]}
          echo "$BASE_RC" > "$OUT/baseline-build.exitcode"

          # mono.proj always emits its own CMAKE_C_FLAGS/CMAKE_CXX_FLAGS after CMakeArgs.
          # Add a validation-only item group so the actual runtime archives are compiled
          # with ASan instead of merely leaving an unused CMake cache variable behind.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/mono/mono.proj')
          s = p.read_text(encoding='utf-8')
          marker = '  <Target Name="BuildMonoRuntime">\n'
          insert = '''  <Target Name="BuildMonoRuntime">\n    <ItemGroup Condition="\'$(TargetsBrowser)\' == \'true\' and \'$(SecurityValidationAsan)\' == \'true\'">\n      <_MonoCFLAGS Include="-fsanitize=address" />\n      <_MonoCXXFLAGS Include="-fsanitize=address" />\n    </ItemGroup>\n'''
          if marker not in s:
              raise SystemExit('BuildMonoRuntime marker missing')
          p.write_text(s.replace(marker, insert, 1), encoding='utf-8')
          PY
          git diff -- src/mono/mono.proj | tee "$OUT/build-infrastructure.patch"

          if [ "$BASE_RC" -eq 0 ]; then
            rm -rf artifacts/obj/mono/browser.wasm.Debug
            timeout --signal=TERM --kill-after=2m 115m ./build.sh -os browser -subset mono.runtime+mono.wasmruntime+libs.pretest -c Debug -rebuild /p:SecurityValidationAsan=true /p:MonoEnableAssertMessages=true 2>&1 | tee "$OUT/asan-runtime-build.log"
            ASAN_RC=${PIPESTATUS[0]}
          else
            ASAN_RC=125
            echo skipped | tee "$OUT/asan-runtime-build.log"
          fi
          echo "$ASAN_RC" > "$OUT/asan-runtime-build.exitcode"

          grep -R -n -- '-fsanitize=address' artifacts/obj/mono/browser.wasm.Debug > "$OUT/runtime-fsanitize-flags.txt" 2>/dev/null || true
          grep -R -n -- '-fsanitize=address' artifacts/obj/mono/browser.wasm.Debug/compile_commands.json > "$OUT/runtime-compile-commands-asan.txt" 2>/dev/null || true

          SAMPLE='src/mono/sample/wasm/console-node/Wasm.Console.Node.Sample.csproj'
          if [ "$ASAN_RC" -eq 0 ]; then
            rm -rf src/mono/sample/wasm/console-node/bin artifacts/obj/mono/Wasm.Console.Node.Sample
            timeout --signal=TERM --kill-after=1m 50m ./dotnet.sh build "$SAMPLE" -c Debug /p:TargetOS=browser /p:Configuration=Debug /p:WasmBuildNative=true /p:WasmNativeStrip=false /p:EmccVerbose=true /p:EmccExtraCFlags=-fsanitize=address /p:EmccExtraLDFlags=-fsanitize=address 2>&1 | tee "$OUT/sample-build.log"
            SAMPLE_RC=${PIPESTATUS[0]}
          else
            SAMPLE_RC=125
            echo skipped | tee "$OUT/sample-build.log"
          fi
          echo "$SAMPLE_RC" > "$OUT/sample-build.exitcode"

          APP='src/mono/sample/wasm/console-node/bin/Debug/AppBundle'
          if [ "$SAMPLE_RC" -eq 0 ] && [ -f "$APP/main.mjs" ]; then
            cp -a "$APP/." "$OUT/bundle/"
            (cd "$APP" && timeout --signal=TERM --kill-after=10s 90s node main.mjs) 2>&1 | tee "$OUT/sample-run.log"
            RUN_RC=${PIPESTATUS[0]}
          else
            RUN_RC=125
            echo skipped | tee "$OUT/sample-run.log"
          fi
          echo "$RUN_RC" > "$OUT/sample-run.exitcode"

          grep -n -- '-fsanitize=address' "$OUT/sample-build.log" > "$OUT/sample-fsanitize-flags.txt" || true
          find "$APP" -type f -name '*.wasm' -print > "$OUT/final-wasm-files.txt" 2>/dev/null || true
          while IFS= read -r wasm; do
            echo "===== $wasm =====" >> "$OUT/final-wasm-asan-symbols.txt"
            grep -a -o -E '__asan_[A-Za-z0-9_]+' "$wasm" | sort -u | head -n 500 >> "$OUT/final-wasm-asan-symbols.txt" || true
          done < "$OUT/final-wasm-files.txt"
          tar -C "$OUT" -czf "$OUT/browser-node-v10-asan-appbundle.tar.gz" bundle
          sha256sum "$OUT/browser-node-v10-asan-appbundle.tar.gz" > "$OUT/browser-node-v10-asan-appbundle.tar.gz.sha256"

          {
            echo "runtime_commit=$(cat "$OUT/runtime-commit.txt")"
            echo "runtime_ref=$(cat "$OUT/runtime-ref.txt")"
            echo "baseline_exit=$BASE_RC"
            echo "asan_runtime_exit=$ASAN_RC"
            echo "sample_build_exit=$SAMPLE_RC"
            echo "sample_run_exit=$RUN_RC"
            echo "runtime_flag_lines=$(wc -l < "$OUT/runtime-compile-commands-asan.txt" 2>/dev/null || echo 0)"
            echo "sample_flag_lines=$(wc -l < "$OUT/sample-fsanitize-flags.txt" 2>/dev/null || echo 0)"
            echo "final_asan_symbols=$(grep -c '__asan_' "$OUT/final-wasm-asan-symbols.txt" 2>/dev/null || true)"
            echo "bundle_files=$(find "$OUT/bundle" -type f | wc -l)"
          } | tee "$OUT/summary.txt"
          exit 0

      - name: Upload actual ASan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-runtime-v10-browser-asan-actual-v2
          path: out/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Enforce actual instrumentation and execution
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/out/browser-asan-v10-v2"
          test "$(cat "$OUT/baseline-build.exitcode")" = 0
          test "$(cat "$OUT/asan-runtime-build.exitcode")" = 0
          test "$(cat "$OUT/sample-build.exitcode")" = 0
          test "$(cat "$OUT/sample-run.exitcode")" = 3
          test -s "$OUT/runtime-compile-commands-asan.txt"
          test -s "$OUT/sample-fsanitize-flags.txt"
          grep -q '__asan_' "$OUT/final-wasm-asan-symbols.txt"
          grep -q 'Hello World!' "$OUT/sample-run.log"
          test -s "$OUT/browser-node-v10-asan-appbundle.tar.gz"
